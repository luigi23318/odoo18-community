name: Aggiornamento Odoo 18.0

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: '18.0'

      - name: Scarica ultimo Odoo 18.0
        run: |
          curl -L -o /tmp/odoo18.zip https://github.com/odoo/odoo/archive/refs/heads/18.0.zip
          unzip /tmp/odoo18.zip -d /tmp

      - name: Aggiorna codice
        run: |
          find . -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.' -exec rm -rf {} +
          cp -r /tmp/odoo-18.0/* .
          cp -r /tmp/odoo-18.0/.* . 2>/dev/null || true

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Aggiornamento Odoo 18.0 - $(date +%Y-%m-%d)"
          git push
